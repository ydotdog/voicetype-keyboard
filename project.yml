name: VoiceType
options:
  bundleIdPrefix: com.kyleqi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    VOICETYPE_APP_GROUP: group.com.kyleqi.voicetype
    VOICETYPE_DEV_CREDIT_KEY: ""
  configs:
    Debug:
      VOICETYPE_BACKEND_URL: https://voicetype.y.dog
    Release:
      VOICETYPE_BACKEND_URL: https://voicetype.y.dog
targets:
  VoiceType:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoiceType
      - path: Shared
    dependencies:
      - target: VoiceTypeKeyboard
        embed: true
    info:
      path: VoiceType/Info.plist
      properties:
        CFBundleDisplayName: VoiceType
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: VoiceType uses the microphone to turn your speech into text. While you keep keyboard mic on, the app records audio so the VoiceType keyboard can transcribe what you say in other apps.
        NSLocalNetworkUsageDescription: VoiceType connects to your configured transcription backend.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        VoiceTypeBackendURL: $(VOICETYPE_BACKEND_URL)
        VoiceTypeDevCreditKey: $(VOICETYPE_DEV_CREDIT_KEY)
        VoiceTypeAppGroup: $(VOICETYPE_APP_GROUP)
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.kyleqi.voicetype
            CFBundleURLSchemes:
              - voicetype
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleqi.voicetype
        INFOPLIST_FILE: VoiceType/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceType/VoiceType.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WC3PWB5R2J
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
  VoiceTypeKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoiceTypeKeyboard
      - path: Shared
    info:
      path: VoiceTypeKeyboard/Info.plist
      properties:
        CFBundleDisplayName: VoiceType Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        VoiceTypeAppGroup: $(VOICETYPE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: en-US
            IsASCIICapable: true
            PrefersRightToLeft: false
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleqi.voicetype.keyboard
        INFOPLIST_FILE: VoiceTypeKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceTypeKeyboard/VoiceTypeKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WC3PWB5R2J
        APPLICATION_EXTENSION_API_ONLY: true
schemes:
  VoiceType:
    build:
      targets:
        VoiceType: all
        VoiceTypeKeyboard: all
    run:
      config: Debug
