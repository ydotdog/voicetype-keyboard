name: iPhone Duo simulator probe

# Temporary. Records what GitHub's Xcode 27 image offers for driving the iPhone Duo
# simulator: its two displays, its posture and its rotation. The test workflow
# needs that to render the app the way the open device shows it. Delete this file
# and scripts/probe once the test workflow does so.
on:
  push:
    paths:
      - .github/workflows/duo-probe.yml
      - scripts/probe/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duo-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SIM_NAME: iPhone Duo
      SIM_OS: "27.1"
    steps:
      - name: Check out the probe script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe the simulator
        timeout-minutes: 22
        run: bash scripts/probe/duo_probe.sh
      - name: Upload what the probe recorded
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duo-probe
          path: out
          if-no-files-found: warn
          retention-days: 7
